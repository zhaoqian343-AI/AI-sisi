<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sisi — 安静做事的工作台</title>
    <meta name="description" content="Sisi 是一个轻量网页起点：一屏主视觉、一段说明、一次简单交互。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <a class="mark" href="#top">Sisi</a>
      <nav>
        <a href="#about">关于</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="kicker">AI-sisi · 本地静态页</p>
        <h1 id="hero-title">把想法先落在一页纸上。</h1>
        <p class="lede">
          没有后台，没有构建步骤。打开这一页，就是一个可以继续长出来的起点。
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="#about">往下看</a>
          <button class="btn ghost" type="button" id="greet-btn">打个招呼</button>
        </div>
        <p class="greeting" id="greeting" hidden></p>
      </section>

      <section class="about" id="about" aria-labelledby="about-title">
        <h2 id="about-title">这一页里有什么</h2>
        <ul class="points">
          <li>
            <span>结构</span>
            主视觉铺满首屏，下面只有一段说明，不堆仪表盘。
          </li>
          <li>
            <span>交互</span>
            点「打个招呼」会换一句欢迎语；「往下看」会平滑滚到这里。
          </li>
          <li>
            <span>适配</span>
            桌面大字铺开，手机收成单列，按钮始终够点。
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <p>Sisi · 本地预览即可</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
